# DINOv3 RGB-D quadruped local navigation parameters.
# Perception stays in ground_seg; this package provides metric BEV +
# footprint-aware planning in base_link.
dinov3_nav:
  ros__parameters:
    # ================= Topics =================
    image_topic: /zed/zed_node/rgb/image_rect_color
    depth_topic: /zed/zed_node/depth/depth_registered
    camera_info_topic: /zed/zed_node/rgb/camera_info
    cmd_vel_topic: /cmd_vel
    goal_pose_topic: /goal_pose
    odom_topic: /odom

    ground_mask_topic: /dinov3_nav/ground_mask
    traversable_mask_topic: /dinov3_nav/traversable_mask
    safe_mask_topic: /dinov3_nav/safe_mask
    obstacle_mask_topic: /dinov3_nav/obstacle_mask
    overlay_topic: /dinov3_nav/overlay
    bev_debug_topic: /dinov3_nav/bev_debug
    raw_bev_topic: /dinov3_nav/raw_bev
    planning_bev_topic: /dinov3_nav/planning_bev
    coverage_topic: /dinov3_nav/coverage
    planner_status_topic: /dinov3_nav/planner_status
    publish_overlay: true
    publish_bev_debug: true
    # publish_bev_debug also enables text-free planning layer topics:
    # raw_bev, planning_bev, bev_traversability, bev_obstacle, bev_observed,
    # bev_free, bev_unknown, bev_inflated_obstacle, bev_clearance, bev_cost.

    # ================= Frames =================
    # Local BEV / trajectory poses / footprint live here. Must be base_link
    # (or any body frame); NEVER the camera frame.
    planner_frame: base_link
    # Global goal frame (PoseStamped without frame_id is assumed to be here).
    global.default_goal_frame: odom

    # Camera frame for TF lookup. Empty -> use CameraInfo.header.frame_id
    # (zed_camera_link in the Gazebo sim; the sim's rl_nav_controller or
    # enable_zed_static_tf publishes base_link <- zed_camera_link).
    camera.frame: ""
    # Pixel-data convention of the depth/RGB pinhole data.
    #   optical: x right, y down, z forward (Gazebo zed_x camera; the frame_id
    #            names a body-oriented frame, so the fixed optical->body
    #            rotation is composed inside the node). DEFAULT, verified
    #            against gazebo_sim_ws_3 .../urdf/zed_x_camera.xacro.
    #   body:    the TF camera frame itself already has optical axes.
    camera.projection_convention: optical

    # ================= Robot body =================
    # Rectangular footprint in planner frame. Replace with measured values
    # before enabling control. Robot center is (0,0) because the planner
    # frame is base_link.
    robot.length: 0.65
    robot.width: 0.6
    robot.safety_margin: 0.1
    robot.center_x: 0.0
    robot.center_y: 0.0
    robot.footprint_sample_step: 0.05

    # ================= Depth =================
    depth.enable: true
    # Extra multiplier after encoding conversion (32FC1=m, 16UC1=mm).
    depth.scale: 1.0
    # Only used for the image-space debug overlay now; BEV obstacles come
    # from 3-D height above the estimated ground plane.
    depth.safe_distance: 1.0
    depth.bottom_exempt_frac: 0.35
    depth.min_valid: 0.20
    depth.sync_slop: 0.05

    # ================= DINOv3 ground_seg =================
    ckpt: /home/dow/DOW/dinov3/dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    resolution: 448
    device: auto
    seed_rows_frac: 0.10
    seed_cols_frac: 0.60
    threshold: otsu

    # ================= SAM2 =================
    sam2.enable: true
    sam2.ckpt: /home/dow/DOW/dinov3/third_party/sam2/checkpoints/sam2.1_hiera_tiny.pt
    # Do not let RGB-only SAM2 expand far outside the depth-vetted coarse
    # mask (hard geometric obstacles must not be re-added by SAM2).
    sam2.max_expand_px: 12

    # ================= Optional stairs head =================
    stairs.enable: false
    stairs.threshold: 0.45
    stairs.min_area: 0.008
    stairs.max_area: 0.35
    stairs.min_risers: 3
    stairs.treat_traversable: true

    # ================= Local BEV =================
    # x forward, y left, expressed in base_link. x_min < 0 keeps the robot's
    # own footprint inside the grid (collision checks at the current pose).
    bev.resolution: 0.05
    bev.x_min: -0.80
    bev.x_max: 4.00
    bev.y_min: -2.20
    bev.y_max: 2.20
    bev.max_depth: 6.0
    bev.pixel_stride: 2
    bev.min_observed_points: 1
    bev.min_obstacle_points: 2
    # Fill only small RGB-D raster holes; do not freely grow the boundary.
    bev.close_radius_m: 0.08
    bev.support_traversability: 0.70
    # Geometric obstacle evidence relative to the estimated ground plane:
    # point higher than ground+obstacle_height -> hard obstacle evidence,
    # lower than ground-drop_height -> hole/drop (non-traversable).
    bev.obstacle_height: 0.15
    bev.drop_height: 0.25
    bev.min_ground_z_points: 200
    # Fail-safe: stop if less than this fraction of BEV cells is observed.
    bev.min_observed_fraction: 0.05
    # Sparse RGB-D ground hits are connected only along sampled rays whose
    # endpoints are already DINO+geometry ground; occluded space stays unknown.
    bev.visibility_raycast: true
    bev.visibility_raycast_stride_px: 8
    # Continuous traversability thresholds for the footprint checker.
    bev.traversability_threshold: 0.50
    bev.hard_nontrav_threshold: 0.15
    bev.hard_nontrav_min_cells: 3
    # Short-horizon motion-compensated temporal fusion in base_link.  Previous
    # evidence is transformed through odom, decayed, then fused with raw BEV.
    bev.temporal_enable: true
    bev.temporal_frame: odom
    bev.temporal_half_life_s: 0.70
    bev.temporal_max_evidence: 6.0
    bev.temporal_observation_hit: 1.0
    bev.temporal_obstacle_hit: 2.0
    bev.temporal_obstacle_clear: 1.5
    bev.temporal_min_observed_evidence: 0.50
    bev.temporal_obstacle_threshold: 1.25
    # Only weak one-cell temporal fragments are dropped; geometric hard hits
    # remain intact and are never removed by ego clearing.
    bev.cleanup_min_obstacle_cells: 2
    bev.ego_clear_radius_m: 0.30
    bev.ego_clear_traversability: 0.80

    # ================= Planning costmap =================
    # Hard / inflated obstacles are forbidden. Unknown remains available at a
    # high cost; clearance raises cost near obstacles so MPPI prefers
    # open corridor centres rather than grazing obstacle edges.
    planning.unknown_cost: 3.0
    planning.nontraversable_cost: 6.0
    planning.clearance_target_m: 0.45
    planning.clearance_cost_weight: 4.0

    # ================= MPPI local planner =================
    # Each update samples and rolls out full (vx, vy, wz) control sequences
    # through the inflated robot-centric costmap. It never chooses a steering
    # direction directly from the current image mask.
    mppi.horizon_steps: 24
    mppi.dt: 0.10
    mppi.samples: 384
    mppi.temperature: 1.0
    mppi.noise_vx: 0.16
    mppi.noise_vy: 0.08
    mppi.noise_wz: 0.55
    mppi.min_vx: -0.10
    mppi.max_vx: 0.40
    # Differential-drive default. Set nonzero only if the downstream base
    # controller genuinely supports Twist.linear.y.
    mppi.max_vy: 0.0
    mppi.max_wz: 1.20
    mppi.max_accel_vx: 4.00
    mppi.max_accel_vy: 0.50
    mppi.max_accel_wz: 6.00
    # Unknown support inside this forward near-field is expected due to the
    # camera blind zone. Collision with inflated obstacles remains forbidden.
    mppi.start_relax_distance: 0.90
    mppi.goal_weight: 5.0
    mppi.terminal_goal_weight: 10.0
    mppi.heading_weight: 0.8
    mppi.costmap_weight: 1.0
    mppi.control_weight: 0.08
    mppi.smooth_weight: 0.35
    mppi.seed: 7

    # ================= Control / global target =================
    # SAFETY: control stays off until TF + CameraInfo + projection sanity
    # are verified (watch /dinov3_nav/bev_debug first). Sanity failure
    # independently forces cmd_vel = 0 even when enabled.
    control.enabled: true
    control.max_angular: 1.2
    control.cruise_linear: 0.35
    control.angular_gain: 1.5
    control.turn_in_place_angle_deg: 43.0
    control.cmd_rate: 10.0
    control.watchdog: 1.5
    control.goal_tolerance: 0.35

    global.enable: true

    # ================= Runtime / saved debug images =================
    process_period: 0.10
    output.enable: true
    output.dir: ""
    output.save_every: 5

    # ================= MPPI debug =================
    # The launch file starts ROS image_view (C++ system OpenCV) by default to
    # show this BEV. Keep this Python/Tk fallback off unless launch is not
    # used. ROS topics and PNG output remain available regardless.
    debug.show_window: false
    debug.window_name: DINOv3_MPPI_BEV
    debug.window_scale: 1.0
    debug.window_rate_hz: 20.0
    # This project venv uses an OpenCV wheel without HighGUI. Tk/Pillow shows
    # the same RGB BEV window without needing to rebuild OpenCV. "auto" tries
    # OpenCV then Tk; "opencv" forces HighGUI when a GUI-enabled cv2 is used.
    debug.window_backend: tk
