# DINOv3 quadruped visual navigation parameters.
# Planner architecture:
#   RGB + registered depth -> DINO traversability -> local BEV
#   -> footprint inflation -> trajectory rollout -> cmd_vel

dinov3_nav:
  ros__parameters:

    # ================= Topics =================
    image_topic: /zed/zed_node/rgb/image_rect_color
    depth_topic: /zed/zed_node/depth/depth_registered
    camera_info_topic: /zed/zed_node/rgb/camera_info

    goal_pose_topic: /goal_pose
    cmd_vel_topic: /cmd_vel

    ground_mask_topic: /dinov3_nav/ground_mask
    traversable_mask_topic: /dinov3_nav/traversable_mask
    safe_mask_topic: /dinov3_nav/safe_mask
    obstacle_mask_topic: /dinov3_nav/obstacle_mask
    overlay_topic: /dinov3_nav/overlay
    coverage_topic: /dinov3_nav/coverage

    publish_overlay: true

    # ================= TF / coordinate frames =================
    # Your current TF already has odom -> zed_camera_link, so this default runs now.
    # If the robot has a true body-centered base_link, change this to base_link.
    base_frame: zed_camera_link

    # IMPORTANT:
    # RGB-D pinhole back-projection requires an optical frame:
    #   X right, Y down, Z forward.
    # Empty string means CameraInfo.header.frame_id is used.
    # If CameraInfo frame is not optical, set the real optical frame explicitly,
    # for example: zed_left_camera_optical_frame
    camera_optical_frame: ""

    # Goal messages without frame_id are interpreted in this frame.
    global.default_goal_frame: odom

    # ================= Robot geometry =================
    # Replace length with the real body length before enabling motion.
    robot.width: 0.40
    robot.length: 0.65

    # Extra clearance outside the body circumscribed footprint.
    robot.safety_margin: 0.10

    # ================= Depth =================
    depth.enable: true
    depth.min_valid: 0.20
    depth.safe_distance: 1.00

    # Bottom part of forward image is exempt from the simple near-depth obstacle rule,
    # because nearby floor itself has small range.
    depth.bottom_exempt_frac: 0.35

    depth.sync_slop: 0.05
    depth.sync_queue: 10

    # ================= DINOv3 ground segmentation =================
    ckpt: /home/dow/DOW/dinov3/dinov3/checkpoints/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
    resolution: 448
    device: auto
    seed_rows_frac: 0.10
    seed_cols_frac: 0.60
    threshold: otsu

    # ================= SAM2 =================
    sam2.enable: true
    sam2.ckpt: /home/dow/DOW/dinov3/third_party/sam2/checkpoints/sam2.1_hiera_tiny.pt

    # ================= Stairs head =================
    stairs.enable: false
    stairs.threshold: 0.45
    stairs.min_area: 0.008
    stairs.max_area: 0.35
    stairs.min_risers: 3
    stairs.treat_traversable: true

    # ================= Local BEV =================
    # planner frame convention:
    #   +x forward, +y left
    bev.resolution: 0.05

    bev.x_min: 0.0
    bev.x_max: 4.0
    bev.y_min: -2.0
    bev.y_max: 2.0

    bev.max_depth: 6.0

    # Project every N image pixels to reduce CPU cost.
    bev.pixel_stride: 2

    bev.min_observed_points: 1
    bev.min_obstacle_points: 2

    # Current DINO output is binary, so 0.5 is appropriate.
    # Later this can directly become the threshold for continuous CAT-style traversability.
    bev.traversability_threshold: 0.50

    # ================= Trajectory planner =================
    planner.horizon: 2.0
    planner.dt: 0.10

    planner.v_samples: [0.15, 0.30, 0.45]
    planner.w_samples: [-0.8, -0.6, -0.4, -0.2, 0.0, 0.2, 0.4, 0.6, 0.8]

    # Forward blind zone around the camera/robot origin.
    planner.start_ignore_distance: 0.25

    # Clearance score saturates after this distance.
    planner.clearance_cap: 0.80

    # Cost weights.
    planner.progress_weight: 2.0
    planner.traversability_weight: 1.0
    planner.clearance_weight: 1.2
    planner.heading_weight: 0.8
    planner.turn_weight: 0.25
    planner.smooth_weight: 0.20

    planner.turn_in_place_angle_deg: 35.0
    planner.turn_gain: 1.2

    # ================= Global goal =================
    global.enable: true
    global.goal_tolerance: 0.35

    # ================= cmd_vel safety =================
    control.enabled: false

    # Keep false until BEV axes / obstacle locations / TF are verified.
    # After verification set control.enabled: true.
    control.max_angular: 0.8
    control.cmd_rate: 10.0
    control.watchdog: 1.5

    # ================= Runtime =================
    process_period: 0.10

    # ================= Debug output =================
    output.enable: true
    output.dir: ""
    output.save_every: 1
